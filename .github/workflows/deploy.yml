name: CI/CD Pipeline Docker

on:
  push:
    branches: [ "dev", "main" ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      app: ${{ steps.filter.outputs.app }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth:
              - "auth-server/**"
              - ".github/workflows/deploy.yml"
            app:
              - "app/**"
              - "lib/**"
              - "prisma/**"
              - "public/**"
              - "package.json"
              - "package-lock.json"
              - "tsconfig.json"
              - "next.config.ts"
              - "postcss.config.mjs"
              - "prisma.config.ts"
              - "Dockerfile"
              - ".dockerignore"
              - ".github/workflows/deploy.yml"

  build-and-deploy-auth:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.auth == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Auth Image
        uses: docker/build-push-action@v4
        with:
          context: ./auth-server
          file: ./auth-server/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/workspace-auth-server:latest
          cache-from: type=gha,scope=workspace-auth-server
          cache-to: type=gha,mode=max,scope=workspace-auth-server

      - name: Deploy Auth Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo mkdir -p /opt/workspace/env
            cat <<'EOF' | sudo tee /opt/workspace/env/workspace-auth-server.env > /dev/null
            ${{ secrets.AUTH_ENV_FILE }}
            EOF
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/workspace-auth-server:latest
            sudo docker stop workspace-auth-server || true
            sudo docker rm workspace-auth-server || true
            sudo docker run -d --restart unless-stopped -p 127.0.0.1:4000:4000 --name workspace-auth-server \
              --env-file /opt/workspace/env/workspace-auth-server.env \
              ${{ secrets.DOCKER_USERNAME }}/workspace-auth-server:latest
            sudo docker image prune -f || true

  build-and-deploy-app:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push App Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/timetable-web:latest
          secrets: |
            APP_ENV_FILE=${{ secrets.APP_ENV_FILE }}
          cache-from: type=gha,scope=timetable-web
          cache-to: type=gha,mode=max,scope=timetable-web

      - name: Deploy App Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo mkdir -p /opt/workspace/env
            cat <<'EOF' | sudo tee /opt/workspace/env/timetable-web.env > /dev/null
            ${{ secrets.APP_ENV_FILE }}
            EOF
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/timetable-web:latest
            sudo docker stop timetable-web || true
            sudo docker rm timetable-web || true
            sudo docker run -d --restart unless-stopped -p 127.0.0.1:3000:3000 --name timetable-web \
              --env-file /opt/workspace/env/timetable-web.env \
              ${{ secrets.DOCKER_USERNAME }}/timetable-web:latest
            sudo docker image prune -f || true
