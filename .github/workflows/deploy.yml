# 1. Base 이미지 교체 (alpine -> bookworm-slim)
# QEMU ARM 번역기 환경에서 npm ci가 뻗는 문제를 해결합니다.
FROM node:20-bookworm-slim AS base
# Debian 환경에서 Prisma가 DB와 통신하기 위해 필요한 openssl 패키지를 미리 설치합니다.
RUN apt-get update && apt-get install -y openssl && rm -rf /var/lib/apt/lists/*

# 2. 패키지 설치 단계
FROM base AS deps
WORKDIR /app
COPY package.json package-lock.json ./
RUN npm ci

# 3. 빌드 단계
FROM base AS builder
WORKDIR /app
COPY --from=deps /app/node_modules ./node_modules
COPY . .

# Prisma Client 생성
RUN npx prisma generate

# 이전에 설정한 BuildKit Secret 마운트를 사용하여 안전하게 환경변수 주입 후 빌드
RUN --mount=type=secret,id=DATABASE_URL \
    --mount=type=secret,id=NEXTAUTH_SECRET \
    --mount=type=secret,id=NEXTAUTH_URL \
    DATABASE_URL="$(cat /run/secrets/DATABASE_URL)" \
    NEXTAUTH_SECRET="$(cat /run/secrets/NEXTAUTH_SECRET)" \
    NEXTAUTH_URL="$(cat /run/secrets/NEXTAUTH_URL)" \
    npm run build

# 4. 프로덕션 실행 단계
FROM base AS runner
WORKDIR /app
ENV NODE_ENV production

# 빌드된 결과물과 실행에 필요한 파일들만 복사
COPY --from=builder /app/public ./public
COPY --from=builder /app/.next ./.next
COPY --from=builder /app/node_modules ./node_modules
COPY --from=builder /app/package.json ./package.json

EXPOSE 3000
ENV PORT 3000

# 서버 실행
CMD ["npm", "start"]
