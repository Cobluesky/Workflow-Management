name: CI/CD Pipeline Docker

on:
  push:
    branches: [ "dev", "main" ]

jobs:
  build-and-deploy-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Auth Image
        uses: docker/build-push-action@v4
        with:
          context: ./auth-server
          file: ./auth-server/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/workspace-auth-server:latest

      - name: Deploy Auth Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo mkdir -p /opt/workspace/env
            cat <<'EOF' | sudo tee /opt/workspace/env/workspace-auth-server.env > /dev/null
            ${{ secrets.AUTH_ENV_FILE }}
            EOF
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/workspace-auth-server:latest
            sudo docker stop workspace-auth-server || true
            sudo docker rm workspace-auth-server || true
            sudo docker run -d --restart unless-stopped -p 127.0.0.1:4000:4000 --name workspace-auth-server \
              --env-file /opt/workspace/env/workspace-auth-server.env \
              ${{ secrets.DOCKER_USERNAME }}/workspace-auth-server:latest
            sudo docker image prune -f || true

  build-and-deploy-app:
    runs-on: ubuntu-latest
    needs: build-and-deploy-auth

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push App Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/timetable-web:latest
          secrets: |
            APP_ENV_FILE=${{ secrets.APP_ENV_FILE }}

      - name: Deploy App Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo mkdir -p /opt/workspace/env
            cat <<'EOF' | sudo tee /opt/workspace/env/timetable-web.env > /dev/null
            ${{ secrets.APP_ENV_FILE }}
            EOF
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/timetable-web:latest
            sudo docker stop timetable-web || true
            sudo docker rm timetable-web || true
            sudo docker run -d --restart unless-stopped -p 127.0.0.1:3000:3000 --name timetable-web \
              --env-file /opt/workspace/env/timetable-web.env \
              ${{ secrets.DOCKER_USERNAME }}/timetable-web:latest
            sudo docker image prune -f || true
