name: CI/CD Pipeline Docker

on:
  push:
    branches: [ "dev", "main" ]

jobs:
  build-and-deploy-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Auth Image
        uses: docker/build-push-action@v4
        with:
          context: ./auth-server
          file: ./auth-server/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/workspace-auth-server:latest

      - name: Deploy Auth Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/workspace-auth-server:latest
            sudo docker stop workspace-auth-server || true
            sudo docker rm workspace-auth-server || true
            sudo docker run -d --restart unless-stopped -p 4000:4000 --name workspace-auth-server \
              -e PORT="4000" \
              -e NODE_ENV="production" \
              -e DATABASE_URL="${{ secrets.AUTH_DATABASE_URL }}" \
              -e JWT_ACCESS_SECRET="${{ secrets.JWT_ACCESS_SECRET }}" \
              -e JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}" \
              -e JWT_ISSUER="${{ secrets.JWT_ISSUER }}" \
              -e JWT_AUDIENCE="${{ secrets.JWT_AUDIENCE }}" \
              -e ACCESS_TOKEN_TTL_MINUTES="${{ secrets.ACCESS_TOKEN_TTL_MINUTES }}" \
              -e REFRESH_TOKEN_TTL_DAYS="${{ secrets.REFRESH_TOKEN_TTL_DAYS }}" \
              -e COOKIE_DOMAIN="${{ secrets.COOKIE_DOMAIN }}" \
              -e COOKIE_SECURE="true" \
              -e CLIENT_ORIGINS="${{ secrets.CLIENT_ORIGINS }}" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e GOOGLE_CALLBACK_URL="${{ secrets.GOOGLE_CALLBACK_URL }}" \
              -e KAKAO_CLIENT_ID="${{ secrets.KAKAO_CLIENT_ID }}" \
              -e KAKAO_CLIENT_SECRET="${{ secrets.KAKAO_CLIENT_SECRET }}" \
              -e KAKAO_CALLBACK_URL="${{ secrets.KAKAO_CALLBACK_URL }}" \
              -e GITHUB_CLIENT_ID="${{ secrets.GITHUB_CLIENT_ID }}" \
              -e GITHUB_CLIENT_SECRET="${{ secrets.GITHUB_CLIENT_SECRET }}" \
              -e GITHUB_CALLBACK_URL="${{ secrets.GITHUB_CALLBACK_URL }}" \
              ${{ secrets.DOCKER_USERNAME }}/workspace-auth-server:latest
            sudo docker image prune -f || true

  build-and-deploy-app:
    runs-on: ubuntu-latest
    needs: build-and-deploy-auth

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push App Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/timetable-web:latest
          secrets: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            AUTH_SERVER_URL=${{ secrets.AUTH_SERVER_URL }}

      - name: Deploy App Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/timetable-web:latest
            sudo docker stop timetable-web || true
            sudo docker rm timetable-web || true
            sudo docker run -d --restart unless-stopped -p 3000:3000 --name timetable-web \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e AUTH_SERVER_URL="${{ secrets.AUTH_SERVER_URL }}" \
              ${{ secrets.DOCKER_USERNAME }}/timetable-web:latest
            sudo docker image prune -f || true
